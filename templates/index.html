<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Table</title>
    <style>
        :root { --bg: #121212; --txt: #f5f5f5; --card: #1e1e1e; --green: #00e676; --gold: #ffd700; --border: #333; --blue: #03a9f4; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--txt); display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; }
        
        .stat-box { text-align: center; }
        .stat-box span { display: block; font-size: 0.8rem; color: #aaa; text-transform: uppercase; }
        .stat-box strong { font-size: 1.2rem; color: var(--txt); }

        /* Dropdown Menu Items */
        .dropdown-item { padding: 12px 15px; border-bottom: 1px solid var(--border); color: var(--txt); text-decoration: none; display: block; cursor: pointer; }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: #2a2a2a; }

        /* Tabs */
        .tabs { display: flex; width: 100%; margin-bottom: 20px; background: var(--card); border-radius: 8px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: bold; background: transparent; border: none; color: #aaa; transition: 0.2s; }
        .tab-btn.active { background: var(--border); color: var(--txt); border-bottom: 3px solid var(--green); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
        .status-pill { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; }
        .Scheduled { background: #ff9800; color: #000; } .Live { background: var(--green); color: #000; } .Ended { background: #757575; color: #fff; }
        .match-badge { border: 1px solid var(--blue); color: var(--blue); padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
        
        .details { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); cursor: default; }
        .expanded .details { display: block; }
        
        button.action-btn { width: 100%; padding: 12px; background: var(--txt); color: var(--bg); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button.undo-btn { background: transparent; border: 1px solid #ff5252; color: #ff5252; }
        
        select.game-filter { width: 100%; padding: 12px; background: var(--card); border: 1px solid var(--border); color: white; border-radius: 6px; margin-bottom: 20px; font-weight: bold; }
        
        /* Leaderboard */
        .ldb-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .ldb-rank { font-weight: bold; color: var(--gold); width: 30px; }
        .ldb-pts { background: var(--border); padding: 4px 10px; border-radius: 12px; font-weight: bold; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .hidden { display: none !important; }
        input[type="text"] { width: 100%; padding: 12px; margin: 15px 0; background: #2a2a2a; border: 1px solid var(--border); color: white; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

    <!-- Username Selection Modal -->
    <div id="user-modal" class="modal-overlay {% if username %}hidden{% endif %}">
        <div class="card" style="width: 80%; max-width: 350px; cursor: default;">
            <h3>Select Username</h3>
            <input type="text" id="username-input" placeholder="e.g. oddvar123" list="users-suggestions" oninput="fetchSuggestions('users', this.value)" autocomplete="off">
            <datalist id="users-suggestions"></datalist>
            <button class="action-btn" onclick="setUsername()">Save & Enter</button>
        </div>
    </div>

    <!-- User Profile Data Modal -->
    <div id="profile-modal" class="modal-overlay hidden">
        <div class="card" style="width: 90%; max-width: 400px; cursor: default; position: relative; max-height: 85vh; overflow-y: auto;">
            <button onclick="closeProfileModal()" style="position: absolute; top: 10px; right: 10px; background: transparent; border: none; color: #aaa; font-size: 1.2rem; width: auto; padding: 0; cursor: pointer;">✖</button>
            <h2 style="margin-top: 0; color: var(--green); text-align: center;" id="modal-prof-name"></h2>
            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
                <div class="stat-box"><span>Rank</span><strong id="prof-rank"></strong></div>
                <div class="stat-box"><span>Points</span><strong id="prof-pts"></strong></div>
                <div class="stat-box"><span>W/L</span><strong id="prof-wl"></strong></div>
            </div>
            
            <div style="margin-top: 25px;">
                <h4 style="border-bottom: 1px solid var(--border); padding-bottom: 5px; color: var(--blue);">Recent Comments</h4>
                <div id="prof-comments-list" style="font-size: 0.85rem; color: #aaa; max-height: 200px; overflow-y: auto;">
                    <!-- Populated via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Top Navigation Bar -->
    <div id="main-navbar" class="hidden" style="width: 100%; padding: 15px 20px; background: #1a1a1a; border-bottom: 2px solid var(--green); display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;">
        <div style="position: relative; cursor: pointer;" onclick="toggleDropdown(event)">
            <div style="color: #aaa; font-size: 0.8rem;">Signed in as</div>
            <div style="font-weight: bold; font-size: 1.2rem; color: var(--green);">
                <span id="nav-prof-name"></span> ▼
            </div>
            
            <!-- Dropdown Menu -->
            <div id="user-dropdown" style="display: none; position: absolute; top: 100%; left: 0; background: var(--card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-top: 10px; z-index: 50; width: 150px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);">
                <div class="dropdown-item" onclick="openProfileModal()">👤 Profile</div>
                <a href="/user_logout" class="dropdown-item" style="color: #ff5252;">🚪 Sign Out</a>
            </div>
        </div>
        
        <div>
            <a href="/admin" style="color: #aaa; text-decoration: none; font-size: 0.9rem; font-weight: bold; padding: 5px;">⚙️ Admin</a>
        </div>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tables-tab', this)">Tables</button>
            <button class="tab-btn" onclick="switchTab('leaderboard-tab', this)">Leaderboards</button>
        </div>

        <!-- Tables Tab -->
        <div id="tables-tab" class="tab-content active">
            <div id="tables-container"></div>
        </div>
        
        <!-- Leaderboard Tab -->
        <div id="leaderboard-tab" class="tab-content">
            <select id="game-filter" class="game-filter" onchange="renderLeaderboard()"></select>
            <div class="card" id="leaderboard-container"></div>
        </div>
    </div>

    <script>
        let expandedTableId = null;
        let pollingData = { tables: [], leaderboards: { "Global": [] }, user_stats: null };
        const currentUsername = "{{ username }}";

        // Dropdown and Modal Logic
        function toggleDropdown(e) {
            e.stopPropagation();
            const drop = document.getElementById('user-dropdown');
            drop.style.display = drop.style.display === 'block' ? 'none' : 'block';
        }

        window.addEventListener('click', () => {
            const drop = document.getElementById('user-dropdown');
            if (drop && drop.style.display === 'block') {
                drop.style.display = 'none';
            }
        });

        function openProfileModal() {
            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').classList.add('hidden');
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function fetchSuggestions(resource, query) {
            if (query.length < 2) return;
            fetch(`/api/search/${resource}?q=${query}`)
                .then(res => res.json())
                .then(items => {
                    const dl = document.getElementById(`${resource}-suggestions`);
                    dl.innerHTML = items.map(i => `<option value="${i}">${i}</option>`).join('');
                })
                .catch(err => console.error("Autocomplete fetch error:", err));
        }

        function setUsername() {
            const val = document.getElementById('username-input').value.trim();
            if (!val) return;
            fetch('/set_username', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: val })
            }).then(() => location.reload()); 
        }

        function toggleExpand(id, event) {
            // Ignore clicks if the user clicked a button, an input text field, or inside the comment container
            if (event.target.tagName === 'BUTTON' || event.target.tagName === 'INPUT' || event.target.closest('.comment-section')) {
                return;
            }
            expandedTableId = expandedTableId === id ? null : id;
            renderTables();
        }

        function joinTable(id) {
            fetch(`/join_table/${id}`, { method: 'POST' }).then(() => fetchData());
        }

        function renderTables() {
            const tCont = document.getElementById('tables-container');
            if (pollingData.tables.length === 0) {
                tCont.innerHTML = '<p style="text-align:center; color:#757575;">No tables active right now.</p>';
                return;
            }
            
            tCont.innerHTML = pollingData.tables.map(t => {
                const statClass = t.timing_status === "Live Now" ? "Live" : t.timing_status;
                const isExpanded = expandedTableId === t.id ? 'expanded' : '';
                const isInterested = t.interested.includes(currentUsername);
                
                const btnHtml = isInterested 
                    ? `<button class="action-btn undo-btn" onclick="joinTable(${t.id})">Remove Interest</button>`
                    : `<button class="action-btn" style="background:var(--green); color:black;" onclick="joinTable(${t.id})">I'm Interested</button>`;

                return `
                <!-- <div class="card ${isExpanded}" onclick="toggleExpand(${t.id}, event)"> -->
                <div class="card ${isExpanded}">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; ${isExpanded}" onclick="toggleExpand(${t.id}, event)">
                        <div>
                            <span class="status-pill ${statClass}">${t.timing_status}</span>
                            <h3 style="margin: 5px 0;">${t.location}</h3>
                            <div style="color: #aaa; font-size: 0.9rem;">${t.time_range}</div>
                        </div>
                        <div style="text-align:right;">
                            <div class="match-badge">${t.match_state}</div>
                            <div style="margin-top: 5px; font-weight: bold; color: var(--green);">👥 ${t.present.length}</div>
                        </div>
                    </div>
                    
                    <div class="details">
                        <h4 style="color:var(--blue); margin:0 0 10px 0;">🎮 ${t.ongoing_game}</h4>
                        <div style="margin-bottom: 10px;"><strong>At Table:</strong><br><span style="color:#aaa;">${t.present.join(', ') || 'No one yet'}</span></div>
                        <div style="margin-bottom: 15px;"><strong>Interested:</strong><br><span style="color:#aaa;">${t.interested.join(', ') || 'None'}</span></div>
                        ${btnHtml}
                        <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
                            <h5 style="margin: 0 0 10px 0; color: var(--txt);">💬 Table Discussion</h5>
                            <div style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;" id="comments-list-${t.id}">
                                ${t.comments.map(c => `
                                    <div style="background: #151515; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border);">
                                        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: #888; margin-bottom: 4px;">
                                            <span style="font-weight: bold; color: var(--green);">@${c.username}</span>
                                            <span>${c.time}</span>
                                        </div>
                                        <div style="font-size: 0.95krem; word-break: break-word; margin-bottom: 6px;">${c.message}</div>
                                        <div style="display: flex; gap: 10px; font-size: 0.8rem;">
                                            <button onclick="voteComment(${c.id}, 'like')" style="background:none; border:none; color:${c.user_vote === 'like' ? 'var(--green)' : '#aaa'}; cursor:pointer; padding:0;">
                                                👍 ${c.likes}
                                            </button>
                                            <button onclick="voteComment(${c.id}, 'dislike')" style="background:none; border:none; color:${c.user_vote === 'dislike' ? '#ff5252' : '#aaa'}; cursor:pointer; padding:0;">
                                                👎 ${c.dislikes}
                                            </button>
                                        </div>
                                    </div>
                                `).join('') || '<p style="font-size:0.85rem; color:#666; text-align:center; margin:5px 0;">No messages yet. Say something!</p>'}
                            </div>
                            <div style="display: flex; gap: 5px;">
                                <input type="text" id="comment-input-${t.id}" placeholder="e.g. im on my way..." style="margin:0; padding:8px; font-size:0.9rem;" />
                                <button onclick="postComment(${t.id})" class="action-btn" style="margin:0; width: auto; padding: 8px 12px; background: var(--green); color: black;">Send</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderLeaderboard() {
            const lCont = document.getElementById('leaderboard-container');
            const filter = document.getElementById('game-filter');
            
            const currentSelection = filter.value || "Global";
            filter.innerHTML = Object.keys(pollingData.leaderboards).map(g => 
                `<option value="${g}" ${g === currentSelection ? 'selected' : ''}>${g} Rankings</option>`
            ).join('');
            
            const activeData = pollingData.leaderboards[filter.value] || [];
            
            lCont.innerHTML = activeData.map((u, i) => `
                <div class="ldb-row">
                    <div style="display:flex; align-items:center; gap: 10px;">
                        <span class="ldb-rank">#${i+1}</span>
                        <strong>${u.username}</strong>
                    </div>
                    <div style="display:flex; align-items:center; gap: 15px;">
                        <div style="color:#aaa; font-size:0.9rem;">
                            <span style="color:var(--green);">${u.wins}W</span> - <span style="color:#ff5252;">${u.losses}L</span>
                        </div>
                        <div class="ldb-pts">${u.points} pts</div>
                    </div>
                </div>
            `).join('');
        }

        function fetchData() {
            fetch('/api/status').then(r => r.json()).then(data => {
                pollingData = data;
                renderProfile();
                renderTables();
                renderLeaderboard();
            });
        }

        function postComment(tableId) {
            if (!currentUsername) {
                alert("Please set a username first!");
                return;
            }
            const input = document.getElementById(`comment-input-${tableId}`);
            const message = input.value.trim();
            if (!message) return;

            fetch(`/table/${tableId}/comment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            }).then(res => {
                if (res.ok) {
                    input.value = '';
                    fetchData(); // Refresh poll data immediately
                }
            });
        }

        function voteComment(commentId, voteType) {
            if (!currentUsername) {
                alert("Please set a username first!");
                return;
            }

            fetch(`/comment/${commentId}/vote`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ vote_type: voteType })
            }).then(res => {
                if (res.ok) {
                    fetchData();
                }
            });
        }

        // Update renderProfile to populate the user's comment history list
        function renderProfile() {
            if (pollingData.user_stats) {
                document.getElementById('main-navbar').classList.remove('hidden');
                document.getElementById('nav-prof-name').innerText = currentUsername;
                document.getElementById('modal-prof-name').innerText = currentUsername;
                document.getElementById('prof-rank').innerText = "#" + pollingData.user_stats.rank;
                document.getElementById('prof-pts').innerText = pollingData.user_stats.points;
                document.getElementById('prof-wl').innerText = pollingData.user_stats.wl_ratio;

                const comList = document.getElementById('prof-comments-list');
                const comments = pollingData.user_stats.comments || [];
                if (comments.length === 0) {
                    comList.innerHTML = '<p style="text-align:center; color:#666;">No comments posted yet.</p>';
                } else {
                    comList.innerHTML = comments.map(c => `
                        <div style="background: #151515; padding: 8px; border-radius: 4px; margin-bottom: 6px; border: 1px solid var(--border);">
                            <div style="display:flex; justify-content:space-between; color:#777; font-size:0.75rem; margin-bottom:2px;">
                                <span style="color:var(--blue);">${c.table_location}</span>
                                <span>${c.time}</span>
                            </div>
                            <div style="color:var(--txt);">${c.message}</div>
                        </div>
                    `).join('');
                }
            }
        }


        fetchData();
        let pollTimer;

        function startPolling() {
            if (!pollTimer) {
                fetchData();
                pollTimer = setInterval(fetchData, 15000);
            }
        }

        function stopPolling() {
            clearInterval(pollTimer);
            pollTimer = null;
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                startPolling();
            } else {
                stopPolling();
            }
        });

        startPolling();
    </script>
</body>
</html>
