<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Table</title>
    <style>
        :root { --bg: #121212; --txt: #f5f5f5; --card: #1e1e1e; --green: #00e676; --gold: #ffd700; --border: #333; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--txt); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: #555; }
        .status-pill { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; }
        .Scheduled { background: #ff9800; color: #000; }
        .Live { background: var(--green); color: #000; }
        .Ended { background: #757575; color: #fff; }
        .match-badge { border: 1px solid #03a9f4; color: #03a9f4; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
        .details { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); cursor: default; }
        .expanded .details { display: block; }
        
        button { width: 100%; padding: 12px; background: var(--txt); color: var(--bg); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin: 15px 0; background: #2a2a2a; border: 1px solid var(--border); color: white; border-radius: 6px; box-sizing: border-box; }
        
        /* Modal */
        #user-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .hidden { display: none !important; }
        
        /* Leaderboard */
        .ldb-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

    <div id="user-modal" class="{% if username %}hidden{% endif %}">
        <div class="card" style="width: 80%; max-width: 350px;">
            <h3>Select Username</h3>
            <p style="font-size: 0.9rem; color: #aaa;">This name is used for the leaderboard and joining tables. No password needed.</p>
            <input type="text" id="username-input" placeholder="e.g. oddvar123">
            <button onclick="setUsername()">Save & Enter</button>
        </div>
    </div>

    <div class="container">
        <h2 style="text-align: center;">Open Tables</h2>
        <div id="tables-container"></div>
        
        <h2 style="text-align: center; margin-top: 40px; color: var(--gold);">🏆 Leaderboard</h2>
        <div class="card" id="leaderboard-container"></div>
    </div>

    <script>
        let expandedTableId = null;
        let pollingData = { tables: [], leaderboard: [] };

        function setUsername() {
            const val = document.getElementById('username-input').value.trim();
            if (!val) return;
            fetch('/set_username', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: val })
            }).then(() => {
                document.getElementById('user-modal').classList.add('hidden');
                fetchData();
            });
        }

        function toggleExpand(id, event) {
            // Prevent toggling if clicking a button inside the card
            if(event.target.tagName === 'BUTTON') return;
            expandedTableId = expandedTableId === id ? null : id;
            render();
        }

        function joinTable(id) {
            fetch(`/join_table/${id}`, { method: 'POST' }).then(() => fetchData());
        }

        function render() {
            const tCont = document.getElementById('tables-container');
            const lCont = document.getElementById('leaderboard-container');

            if (pollingData.tables.length === 0) {
                tCont.innerHTML = '<p style="text-align:center; color:#757575;">No tables scheduled.</p>';
            } else {
                tCont.innerHTML = pollingData.tables.map(t => {
                    const statClass = t.timing_status === "Live Now" ? "Live" : t.timing_status;
                    const isExpanded = expandedTableId === t.id ? 'expanded' : '';
                    
                    return `
                    <div class="card ${isExpanded}" onclick="toggleExpand(${t.id}, event)">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <span class="status-pill ${statClass}">${t.timing_status}</span>
                                <h3 style="margin: 5px 0;">${t.location}</h3>
                                <div style="color: #aaa; font-size: 0.9rem;">${t.time_range}</div>
                            </div>
                            <div style="text-align:right;">
                                <div class="match-badge">${t.match_state}</div>
                                <div style="margin-top: 5px; font-weight: bold; color: var(--green);">👥 ${t.present.length}</div>
                            </div>
                        </div>
                        
                        <div class="details">
                            <h4 style="color:#03a9f4; margin:0 0 10px 0;">🎮 ${t.ongoing_game}</h4>
                            
                            <div style="margin-bottom: 10px;">
                                <strong>At Table:</strong><br>
                                <span style="color:#aaa;">${t.present.join(', ') || 'No one yet'}</span>
                            </div>
                            
                            <div style="margin-bottom: 15px;">
                                <strong>Interested:</strong><br>
                                <span style="color:#aaa;">${t.interested.join(', ') || 'None'}</span>
                            </div>
                            
                            <button onclick="joinTable(${t.id})" style="background:var(--green); color:black;">I'm Interested</button>
                        </div>
                    </div>`;
                }).join('');
            }

            lCont.innerHTML = pollingData.leaderboard.map((u, i) => `
                <div class="ldb-row">
                    <div><strong>${i+1}. ${u.username}</strong></div>
                    <div style="color:#aaa;">
                        <span style="color:var(--green);">${u.wins} W</span> / 
                        <span style="color:#ff5252;">${u.losses} L</span>
                    </div>
                </div>
            `).join('');
        }

        function fetchData() {
            fetch('/api/status').then(r => r.json()).then(data => {
                pollingData = data;
                render();
            });
        }

        fetchData();
        setInterval(fetchData, 15000); // 15 seconds for tighter game loops
    </script>
</body>
</html>
